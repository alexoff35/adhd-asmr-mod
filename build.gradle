plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

group = 'io.github.alexoff35'
version = '1.0.0'

base {
    archivesName = 'adhd-asmr-fabric-26.3'
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.166.2+26.3'
    implementation 'com.terraformersmc:modmenu:21.0.0'
    implementation 'maven.modrinth:mcef-modern:dwiy9wKy'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

jar {
    from('LICENSE')
}
