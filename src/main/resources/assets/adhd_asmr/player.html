<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ADHD ASMR</title>
<style>
html, body, #player { width: 100%; height: 100%; margin: 0; background: #111; overflow: hidden }
#message { color: white; font: 16px sans-serif; margin: 20px }
iframe { display: block; border: 0 }
</style>
</head>
<body>
<div id="player"><p id="message">Loading YouTube…</p></div>
<script>
'use strict';
let player;
let ready = false;
let video = '';
let showing = false;
let resume = false;
let initialVolume = 35;
let volumeSteps = [];
const statusMessage = document.getElementById('message');

window.corner = {
    select(id) {
        video = id;
        resume = true;
        if (ready) {
            if (showing) player.loadVideoById(id);
            else player.cueVideoById(id);
        }
    },
    visible(value) {
        if (showing === value) return;
        showing = value;
        if (!ready || !video) return;
        if (showing) {
            if (resume) player.playVideo();
        } else {
            const state = player.getPlayerState();
            resume = state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING;
            player.pauseVideo();
        }
    },
    toggle() {
        if (!video || !showing) return;
        if (!ready) { resume = !resume; return; }
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) player.pauseVideo();
        else player.playVideo();
    },
    volume(delta) {
        if (!ready) { volumeSteps.push(delta); return; }
        const volume = Math.max(0, Math.min(100, player.getVolume() + delta));
        if (volume > 0 && player.isMuted()) player.unMute();
        player.setVolume(volume);
    }
};

window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: { controls: 1, fs: 0, playsinline: 1, origin: location.origin,
                      widget_referrer: 'https://github.com/alexoff35/adhd-asmr-mod' },
        events: {
            onReady() {
                ready = true;
                player.setVolume(initialVolume);
                for (const step of volumeSteps) window.corner.volume(step);
                volumeSteps = [];
                if (!video) return;
                if (showing && resume) player.loadVideoById(video);
                else player.cueVideoById(video);
            }
        }
    });
};
const script = document.createElement('script');
script.src = 'https://www.youtube.com/iframe_api';
script.onerror = () => statusMessage.textContent = 'YouTube could not be reached.';
document.head.append(script);
let lastSequence = 0;
async function sync() {
    try {
        const response = await fetch('state', {cache: 'no-store'});
        if (!response.ok) return;
        const state = await response.json();
        if (state.id && state.id !== video) window.corner.select(state.id);
        if (!state.id && video) {
            if (ready) player.stopVideo();
            video = '';
            resume = false;
        }
        window.corner.visible(state.visible);
        for (const command of state.commands) {
            if (command.sequence <= lastSequence) continue;
            lastSequence = command.sequence;
            if (command.action === 'toggle') window.corner.toggle();
            if (command.action === 'volume') window.corner.volume(command.value);
        }
    } catch (error) {
        // The game may have just closed the embedded page.
    } finally {
        setTimeout(sync, 150);
    }
}
sync();
</script>
</body>
</html>
